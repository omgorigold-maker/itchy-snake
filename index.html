<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itchy Snake</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-group">
        <h1>Itchy Snake</h1>
        <p class="subtitle">Classic snake, except every 4 seconds it stops to scratch its little snaketicals.</p>
      </div>
      <div class="controls-bar">
        <button id="pauseBtn" type="button" class="btn">Pause</button>
        <button id="soundBtn" type="button" class="btn">Sound: On</button>
      </div>
    </header>

    <section class="hud" aria-label="Game stats">
      <div class="stat-card">
        <span class="stat-label">Score</span>
        <strong id="scoreVal" class="stat-value">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Best</span>
        <strong id="bestVal" class="stat-value">0</strong>
      </div>
      <div class="stat-card itch-card">
        <div class="itch-header">
          <span class="stat-label">Itch Meter</span>
          <span id="itchStatus" class="itch-status">4.0s</span>
        </div>
        <div class="itch-track" aria-hidden="true">
          <div id="itchFill" class="itch-fill"></div>
        </div>
      </div>
    </section>

    <section class="stage-wrap" id="stageWrap">
      <canvas
        id="gameCanvas"
        width="560"
        height="560"
        aria-label="Itchy Snake game board"
      ></canvas>

      <div id="overlay" class="overlay" role="dialog" aria-modal="false" aria-labelledby="overlayTitle">
        <div class="overlay-card">
          <h2 id="overlayTitle">Ready to Slither?</h2>
          <p id="overlayDesc">
            Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to steer. Eat apples, avoid walls and yourself — and brace for the 4-second scratch breaks!
          </p>
          <div class="overlay-actions">
            <button id="startBtn" type="button" class="btn btn-primary">Start Game</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer-bar">
      <div class="touch-dpad" aria-label="Directional controls">
        <button type="button" class="dpad-btn up" data-dir="up" aria-label="Up">▲</button>
        <div class="dpad-mid">
          <button type="button" class="dpad-btn left" data-dir="left" aria-label="Left">◀</button>
          <button type="button" class="dpad-btn down" data-dir="down" aria-label="Down">▼</button>
          <button type="button" class="dpad-btn right" data-dir="right" aria-label="Right">▶</button>
        </div>
      </div>
      <p class="hint">Space / P to pause &bull; R to restart</p>
    </footer>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
